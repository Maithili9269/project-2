<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You, Nesumi</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <style>
        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #2b1810, #d4a373, #5c3d2e, #fefae0);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            text-align: center;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,253,245,0.25) 0%, rgba(0,0,0,0) 70%);
            pointer-events: none; 
            z-index: 1;
            animation: lightFlicker 6s infinite alternate ease-in-out;
        }

        @keyframes lightFlicker {
            0% { opacity: 0.4; transform: scale(0.95); }
            30% { opacity: 0.8; transform: scale(1.05); }
            65% { opacity: 0.5; transform: scale(0.98); }
            100% { opacity: 0.9; transform: scale(1.02); }
        }

        .content {
            position: relative;
            z-index: 2;
            text-shadow: 0px 2px 10px rgba(0, 0, 0, 0.4);
            background: rgba(0, 0, 0, 0.15);
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 600px;
            width: 100%;
            box-sizing: border-box;
        }

        h1 {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 2.2rem;
            font-style: normal;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 15px;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
            opacity: 0.9;
            margin-bottom: 25px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .nav-btn {
            background-color: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 12px 26px;
            font-size: 1rem;
            border-radius: 50px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            font-family: inherit;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            cursor: pointer;
        }

        .nav-btn:hover {
            background-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.2);
        }

        .action-btn {
            background-color: rgba(212, 163, 115, 0.25);
            border-color: rgba(212, 163, 115, 0.5);
        }

        .action-btn:hover {
            background-color: rgba(212, 163, 115, 0.45);
            box-shadow: 0 6px 20px rgba(212, 163, 115, 0.3);
        }
    </style>
</head>
<body>

    <div class="content">
        <h1>Have I interrupted your peace by texting you?</h1>
        <p>if you are skipping the question, skipping = Yes</p>
        
        <div class="btn-container" style="margin-bottom: 30px;">
            <button class="nav-btn action-btn" id="yes-btn">
                <span>Yes</span>
            </button>
            <button class="nav-btn action-btn" id="no-btn">
                <span>No</span>
            </button>
            <button class="nav-btn action-btn" id="skip-btn">
                <span>Skip 💨</span>
            </button>
        </div>

        <div class="btn-container">
            <a href="page2.html" class="nav-btn">
                <span>⬅️</span> <span>Go Back</span>
            </a>
        </div>
    </div>

    <script>
        const yesBtn = document.getElementById('yes-btn');
        const noBtn = document.getElementById('no-btn');
        const skipBtn = document.getElementById('skip-btn');

        yesBtn.addEventListener('click', () => {
            alert("I'm really sorry if I did... I'll try to give you your space. ");
            window.location.href = 'page4.html';
        });

        noBtn.addEventListener('click', () => {
            alert("Uff! Thank goodness... balance wapas aa gaya dil mein! ");
            window.location.href = 'page5.html';
        });

        skipBtn.addEventListener('click', () => {
            alert("I'm really sorry if I did... I'll try to give you your space. 🥺");
            window.location.href = 'page4.html';
        });
    </script>
</body>
</html>
