
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloody Red Glitter Rain</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(-45deg, #2b0000, #8b0000, #4a0404, #3d0000);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .text-container {
            text-align: center;
            color: white;
            font-family: 'Dancing Script', cursive;
            z-index: 10;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .main-text { font-size: 5rem; margin: 0; }
        .sub-text { font-size: 2rem; margin: 0; }

        /* Button Styling */
        #action-btn {
            margin-top: 30px;
            padding: 15px 30px;
            font-size: 1.5rem;
            font-family: 'Dancing Script', cursive;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid white;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
        }
        #action-btn:hover { background: rgba(255, 255, 255, 0.4); }

        .glitter {
            position: absolute;
            top: -20px;
            background-color: white;
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 15px 2px white, 0 0 5px white;
            animation: fall linear infinite;
            z-index: 5;
        }

        @keyframes fall {
            0% { transform: translateY(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(105vh); opacity: 0; }
        }
    </style>
</head>
<body>

    <audio id="bg-music">
        <source src="song.mpeg.wav" type="audio/wav">
    </audio>

    <div class="text-container">
        <h1 class="main-text">Thank you!</h1>
        <p class="sub-text">Merry Christmas in advance</p>
        <button id="action-btn" onclick="handleAction()">Next</button>
    </div>

    <script>
        const audio = document.getElementById('bg-music');
        const btn = document.getElementById('action-btn');
        let isFirstClick = true;

        function handleAction() {
            if (isFirstClick) {
                // Play music and change button to Exit
                audio.play();
                btn.innerText = "Exit";
                isFirstClick = false;
            } else {
                // Exit logic (close window or redirect)
                window.close(); // Note: Browsers may block closing windows not opened by scripts
                // OR use window.location.href = 'index.html'; 
            }
        }

        // Particles
        for (let i = 0; i < 300; i++) {
            const glitter = document.createElement('div');
            glitter.className = 'glitter';
            const size = Math.random() * 4 + 1;
            glitter.style.width = size + 'px';
            glitter.style.height = size + 'px';
            glitter.style.left = Math.random() * 100 + '%';
            glitter.style.animationDuration = (Math.random() * 3 + 2) + 's';
            glitter.style.animationDelay = Math.random() * 5 + 's';
            document.body.appendChild(glitter);
        }
    </script>
</body>
</html>
